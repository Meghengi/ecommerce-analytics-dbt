version: 2

seeds:
  - name: raw_customers
    description: >
      One row per customer. Synthetic data generated by
      scripts/generate_seed_data.py — stands in for a `customers` table
      landed by an EL tool in a real pipeline.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: email
        data_tests:
          - not_null
      - name: signup_date
        data_tests:
          - not_null

  - name: raw_products
    description: One row per product in the catalog.
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: unit_price
        data_tests:
          - not_null

  - name: raw_orders
    description: One row per order placed.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_customers')
              field: customer_id
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'refunded', 'cancelled']

  - name: raw_order_items
    description: One row per line item within an order.
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_orders')
              field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('raw_products')
              field: product_id
